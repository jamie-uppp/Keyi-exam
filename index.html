<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆包抽盲盒</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#d8f3ff);
    font-family:"Microsoft YaHei",sans-serif;
}

.container{
    text-align:center;
}

h1{
    color:#ff4f8b;
}

.box{
    width:180px;
    height:180px;
    margin:20px auto;
    background:#ffb347;
    border-radius:20px;
    position:relative;
    cursor:pointer;
    transition:.4s;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.box:hover{
    transform:scale(1.05);
}

.box::before{
    content:"🎁";
    position:absolute;
    font-size:80px;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

button{
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:#ff4f8b;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.result{
    margin-top:25px;
    font-size:32px;
    min-height:80px;
    transition:.3s;
}

.tip{
    margin-top:10px;
    color:#666;
}
</style>
</head>

<body>

<div class="container">
    <h1>🐻 豆包抽盲盒</h1>

    <div class="box" id="box"></div>

    <button onclick="openBox()">打开盲盒</button>

    <div class="result" id="result">？</div>

    <div class="tip">点击按钮试试运气吧！</div>
</div>

<script>
const toys = [
    "🐻 普通豆包",
    "😎 墨镜豆包",
    "🚀 宇航员豆包",
    "🦄 彩虹豆包",
    "👑 隐藏款豆包"
];

function openBox() {

    const result = document.getElementById("result");
    const box = document.getElementById("box");

    box.style.transform = "rotate(10deg) scale(1.1)";
    result.innerHTML = "✨ 开盒中...";

    setTimeout(() => {

        let random = Math.floor(Math.random() * toys.length);

        result.innerHTML = toys[random];

        box.style.transform = "rotate(0deg) scale(1)";

    }, 1000);
}
</script>

</body>
</html>
