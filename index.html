<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>原版答案之书 Demo</title>
    <style>
        *{box-sizing: border-box;margin:0;padding:0;font-family: system-ui,宋体}
        body{background:#f7f3ec;padding:40px;max-width:550px;margin:0 auto}
        .wrap{background:#fff;padding:30px;border-radius:14px;box-shadow:0 3px 15px #e2ddd5;text-align:center}
        .tip-text{color:#666;font-size:17px;margin-bottom:25px;line-height:1.6}
        .open-btn{padding:12px 30px;background:#725c49;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
        .open-btn:active{opacity:0.85}
        .result-box{margin-top:30px;min-height:220px;border:1px solid #e6e2dd;padding:20px;border-radius:10px;line-height:1.8;font-size:17px}
        .rank-SSR{color:#c42828;font-weight:bold}
        .rank-SR{color:#8b4fbb;font-weight:bold}
        .rank-R{color:#3278b9}
        .rank-N{color:#444}
    </style>
</head>
<body>
<div class="wrap">
    <div class="tip-text">
        📖 在心里默默想好你的问题<br>
        想好之后，点击下方按钮随机翻开书页
    </div>
    <button class="open-btn" onclick="openBook()">翻开答案之书</button>
    <div id="resultBox" class="result-box"></div>
</div>

<script>
// 答案文案库
const bookDict = {
    N: [
        "顺其自然便是最优解",
        "小事不必反复内耗纠结",
        "放慢脚步，答案在路上",
        "先行动，疑惑自会消散",
        "平常心看待得失即可",
        "搁置片刻，隔日再抉择",
        "遵从当下的生活节奏",
        "不必强求事事圆满"
    ],
    R: [
        "遵从内心第一眼的想法",
        "选让你轻松的那条路就对",
        "犹豫时，偏向未知尝试",
        "当下的犹豫源于顾虑太多",
        "放弃内耗，大胆做决定",
        "身边人的建议可做参考"
    ],
    SR: [
        "所有波折都是铺垫前路的礼物，不必困于一时得失，时间会印证你的选择。",
        "人生没有绝对错误的抉择，每一步经历都在塑造未来的自己，安心前行。",
        "暂时的迷茫是蓄力阶段，沉下心沉淀，转机往往藏在坚持之后。"
    ],
    SSR: [
        "【隐藏彩蛋】好运加持，当下的难题不久便迎刃而解",
        "【隐藏彩蛋】听从直觉，你的潜意识早已给出正确答案"
    ]
}
const rankName = {
    N:"普通书页",
    R:"精良箴言",
    SR:"稀有寄语",
    SSR:"隐藏神秘页"
}
const rankCssClass = {
    N:"rank-N",
    R:"rank-R",
    SR:"rank-SR",
    SSR:"rank-SSR"
}

// 概率分配 N65% R25% SR8% SSR2%
function getRandomRank(){
    let r = Math.random();
    if(r < 0.65) return "N";
    if(r < 0.90) return "R";
    if(r < 0.98) return "SR";
    return "SSR";
}

function sleep(ms){
    return new Promise(res=>setTimeout(res,ms))
}

// 翻书主逻辑
async function openBook(){
    const box = document.getElementById("resultBox");
    box.innerText = "指尖按住书脊……";
    await sleep(1200);
    box.innerText = "沙沙沙，书页不停快速翻动";
    await sleep(2200);
    box.innerText = "某一页忽然自动停下";
    await sleep(1500);

    // 抽取结果
    let level = getRandomRank();
    let content = bookDict[level][Math.floor(Math.random() * bookDict[level].length)];
    box.innerHTML = `<span class="${rankCssClass[level]}">【${rankName[level]}】<br><br>${content}</span>`;
}
</script>
</body>
